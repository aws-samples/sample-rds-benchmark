AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon RDS Benchmark Stack.
  Deploys a single RDS instance with TLS enforced and an EC2 client
  pre-configured with Sysbench. Supports Graviton, Intel, and AMD instance families.
  Run /opt/run-benchmark.sh after deployment.
  Deploy multiple stacks in parallel to compare instances side-by-side.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Database Configuration
        Parameters:
          - DatabaseEngine
          - InstanceClass
      - Label:
          default: Benchmark Configuration (optional)
        Parameters:
          - SysbenchTables
          - SysbenchTableSize
          - SysbenchThreads
          - SysbenchDuration
      - Label:
          default: Network Configuration (optional)
        Parameters:
          - VpcCidr
    ParameterLabels:
      DatabaseEngine:
        default: Database Engine
      InstanceClass:
        default: RDS Instance Class
      SysbenchTables:
        default: Number of Sysbench Tables
      SysbenchTableSize:
        default: Rows per Table
      SysbenchThreads:
        default: Concurrent Threads
      SysbenchDuration:
        default: Test Duration (seconds)
      VpcCidr:
        default: VPC CIDR Block

Parameters:
  DatabaseEngine:
    Type: String
    Default: postgres
    AllowedValues:
      - postgres
      - mysql
      - mariadb
    Description: Database engine to benchmark.

  InstanceClass:
    Type: String
    Default: db.m8g.xlarge
    AllowedValues:
      # --- Graviton (Arm) ---
      - db.m6g.xlarge
      - db.m7g.xlarge
      - db.m8g.xlarge
      - db.m9g.xlarge
      - db.m6g.2xlarge
      - db.m7g.2xlarge
      - db.m8g.2xlarge
      - db.m9g.2xlarge
      - db.m6g.4xlarge
      - db.m7g.4xlarge
      - db.m8g.4xlarge
      - db.m9g.4xlarge
      # --- Intel (x86) --- uncomment when needed
      # - db.m5.xlarge
      # - db.m6i.xlarge
      # - db.m7i.xlarge
      # - db.m5.2xlarge
      # - db.m6i.2xlarge
      # - db.m7i.2xlarge
      # - db.m5.4xlarge
      # - db.m6i.4xlarge
      # - db.m7i.4xlarge
      # --- AMD (x86) --- uncomment when needed
      # - db.m6a.xlarge
      # - db.m7a.xlarge
      # - db.m6a.2xlarge
      # - db.m7a.2xlarge
      # - db.m6a.4xlarge
      # - db.m7a.4xlarge
      # --- Future Graviton --- uncomment when available
      # - db.m10g.xlarge
      # - db.m10g.2xlarge
      # - db.m10g.4xlarge
    Description: >
      RDS instance class to benchmark. Supports Graviton (m*g), Intel (m*i),
      and AMD (m*a) families. Uncomment additional entries as needed.

  SysbenchTables:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 64
    Description: Number of Sysbench tables.

  SysbenchTableSize:
    Type: Number
    Default: 2000000
    MinValue: 10000
    Description: Number of rows per Sysbench table.

  SysbenchThreads:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 512
    Description: Number of concurrent Sysbench threads.

  SysbenchDuration:
    Type: Number
    Default: 1800
    MinValue: 60
    Description: Benchmark duration in seconds (default 30 minutes).

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 ARM64 AMI. Do not modify.

  VpcCidr:
    Type: String
    Default: 10.192.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    ConstraintDescription: Must be a valid /16 CIDR block (e.g., 10.192.0.0/16).
    Description: >
      VPC CIDR block for the benchmark stack. Change if the default conflicts
      with an existing VPC in your account.

Mappings:
  EngineConfig:
    postgres:
      Engine: postgres
      Version: '17.10'
      Port: '5432'
      Family: postgres17
    mysql:
      Engine: mysql
      Version: '8.4.9'
      Port: '3306'
      Family: mysql8.4
    mariadb:
      Engine: mariadb
      Version: '11.4.12'
      Port: '3306'
      Family: mariadb11.4

Conditions:
  IsPostgres: !Equals [!Ref DatabaseEngine, postgres]
  IsNotPostgres: !Not [!Equals [!Ref DatabaseEngine, postgres]]

Resources:
  # ===================== NETWORKING =====================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-b'

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public'

  IGW:
    Type: AWS::EC2::InternetGateway

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: IGWAttachment
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  PublicSubnetRTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ===================== SECURITY GROUPS =====================
  EC2SG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Sysbench benchmark client
      VpcId: !Ref VPC
      # No inbound rules needed - EC2 only initiates outbound connections

  RDSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS benchmark instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !FindInMap [EngineConfig, !Ref DatabaseEngine, Port]
          ToPort: !FindInMap [EngineConfig, !Ref DatabaseEngine, Port]
          SourceSecurityGroupId: !Ref EC2SG

  VPCEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC Endpoints
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr

  # ===================== VPC ENDPOINTS =====================
  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VPCEndpointSG]
      PrivateDnsEnabled: true

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VPCEndpointSG]
      PrivateDnsEnabled: true

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VPCEndpointSG]
      PrivateDnsEnabled: true

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VPCEndpointSG]
      PrivateDnsEnabled: true

  # ===================== RDS =====================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Benchmark DB subnet group
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  PostgresParamGroup:
    Type: AWS::RDS::DBParameterGroup
    Condition: IsPostgres
    Properties:
      Family: postgres17
      Description: Benchmark - TLS enforced
      Parameters:
        rds.force_ssl: '1'

  MySQLMariaDBParamGroup:
    Type: AWS::RDS::DBParameterGroup
    Condition: IsNotPostgres
    Properties:
      Family: !FindInMap [EngineConfig, !Ref DatabaseEngine, Family]
      Description: Benchmark - TLS enforced
      Parameters:
        require_secure_transport: '1'

  RDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-db-credentials'
      Description: RDS benchmark credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "benchadmin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DependsOn: PrivateRoute
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}'
      DBInstanceClass: !Ref InstanceClass
      Engine: !FindInMap [EngineConfig, !Ref DatabaseEngine, Engine]
      EngineVersion: !FindInMap [EngineConfig, !Ref DatabaseEngine, Version]
      MasterUsername: !Sub '{{resolve:secretsmanager:${RDSSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RDSSecret}:SecretString:password}}'
      AllocatedStorage: 200
      StorageType: io2
      Iops: 10000
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSG
      DBParameterGroupName: !If
        - IsPostgres
        - !Ref PostgresParamGroup
        - !Ref MySQLMariaDBParamGroup
      DBName: sbtest
      Port: !FindInMap [EngineConfig, !Ref DatabaseEngine, Port]
      PubliclyAccessible: false
      MultiAZ: false                  # BENCHMARK ONLY - enable for production workloads
      DeletionProtection: false       # BENCHMARK ONLY - enable for production workloads
      BackupRetentionPeriod: 0        # BENCHMARK ONLY - set to 7+ for production workloads
      CACertificateIdentifier: rds-ca-rsa2048-g1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-${InstanceClass}'
        - Key: Purpose
          Value: RDSBenchmark

  # ===================== EC2 CLIENT =====================
  # Client instance is always Graviton (Arm) regardless of RDS instance under test.
  # The client generates load - its processor does not affect RDS benchmark results.
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref RDSSecret

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  BenchmarkEC2:
    Type: AWS::EC2::Instance
    DependsOn:
      - RDSInstance
      - SecretsManagerEndpoint
    Properties:
      InstanceType: m7g.4xlarge
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref EC2SG
      IamInstanceProfile: !Ref EC2InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-client'
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -eo pipefail
            exec > /var/log/benchmark-setup.log 2>&1
            echo "=== Setup Started: $(date) ==="

            # --- Install ONLY what Sysbench needs to build and run ---
            dnf install -y gcc make automake libtool git jq \
              openssl-devel zlib-devel \
              postgresql16-server-devel postgresql16 \
              mariadb105-devel mariadb105

            # --- Build Sysbench from source ---
            # Sysbench master, pinned to SHA for reproducibility and supply-chain safety (P0-2).
            # Cannot use 1.0.20 release (ebf1c90, April 2020) — it predates OpenSSL 3.x and
            # lacks CA certificate auto-discovery needed for TLS on Amazon Linux 2023.
            # The --mysql-ssl=on flag fails with "No such file or directory" on AL2023 + libmariadb.
            # Pinned commit: 3ceba0b (2026-07-30, master HEAD at time of validation)
            cd /opt
            git clone https://github.com/akopytov/sysbench.git
            cd sysbench
            git checkout 3ceba0b1e115f8c50d1d045a4574d8ed643bd497
            ./autogen.sh
            ./configure \
              --with-pgsql \
              --with-pgsql-includes=/usr/include \
              --with-pgsql-libs=/usr/lib64 \
              --with-mysql
            make -j$(nproc)
            make install
            ln -sf /usr/local/bin/sysbench /usr/bin/sysbench

            # --- Write benchmark environment (NO credentials on disk) ---
            mkdir -p /opt/results
            chown ssm-user:ssm-user /opt/results 2>/dev/null || true
            chmod 755 /opt/results
            cat > /opt/bench-env.sh << ENVEOF
            export DB_ENGINE="${DBEngine}"
            export DB_HOST="${RDSEndpointAddr}"
            export DB_PORT="${DBPort}"
            export INST_CLASS="${DBInstanceClass}"
            export TABLES=${SysbenchTables}
            export TABLE_SIZE=${SysbenchTableSize}
            export THREADS=${SysbenchThreads}
            export DURATION=${SysbenchDuration}
            export SECRET_ARN="${RDSSecret}"
            export AWS_DEFAULT_REGION="${AWS::Region}"
            ENVEOF

            # --- Create benchmark script (fetches password at runtime) ---
            cat > /opt/run-benchmark.sh << 'SCRIPT'
            #!/bin/bash
            set -eo pipefail
            source /opt/bench-env.sh

            # --- Ensure results directory is writable ---
            sudo chown "$(whoami)" /opt/results 2>/dev/null || true

            # --- Retrieve credentials at runtime (never persisted to disk) ---
            DB_PASS=$(aws secretsmanager get-secret-value \
              --secret-id "$SECRET_ARN" --region "$AWS_DEFAULT_REGION" \
              --query SecretString --output text | jq -r '.password')

            # --- Pass password via environment variable (not visible in /proc or ps) ---
            if [[ "$DB_ENGINE" == "postgres" ]]; then
              export PGSSLMODE=require
              export PGPASSWORD="$DB_PASS"
              DRIVER_ARGS="--db-driver=pgsql --pgsql-host=$DB_HOST --pgsql-port=$DB_PORT --pgsql-user=benchadmin --pgsql-db=sbtest"
            else
              export MYSQL_PWD="$DB_PASS"
              DRIVER_ARGS="--db-driver=mysql --mysql-host=$DB_HOST --mysql-port=$DB_PORT --mysql-user=benchadmin --mysql-db=sbtest --mysql-ssl=on"
            fi
            unset DB_PASS

            RESULT_FILE="/opt/results/$DB_ENGINE-$INST_CLASS-$(date +%Y%m%d-%H%M%S).log"

            echo "============================================================"
            echo " Amazon RDS Benchmark"
            echo " Engine: $DB_ENGINE | Instance: $INST_CLASS"
            echo " Tables: $TABLES x $TABLE_SIZE | Threads: $THREADS"
            echo " Duration: ${!DURATION}s | TLS: Enforced"
            echo " Results: $RESULT_FILE"
            echo "============================================================"
            echo ""

            echo ">>> PREPARE..." | tee "$RESULT_FILE"
            sysbench /usr/local/share/sysbench/oltp_read_write.lua \
              $DRIVER_ARGS --tables=$TABLES --table-size=$TABLE_SIZE \
              prepare 2>&1 | tee -a "$RESULT_FILE"
            echo "" | tee -a "$RESULT_FILE"

            echo ">>> RUN (${!DURATION}s)..." | tee -a "$RESULT_FILE"
            sysbench /usr/local/share/sysbench/oltp_read_write.lua \
              $DRIVER_ARGS --tables=$TABLES --table-size=$TABLE_SIZE \
              --threads=$THREADS --time=$DURATION --report-interval=10 \
              run 2>&1 | tee -a "$RESULT_FILE"
            echo "" | tee -a "$RESULT_FILE"

            echo ">>> CLEANUP..." | tee -a "$RESULT_FILE"
            sysbench /usr/local/share/sysbench/oltp_read_write.lua \
              $DRIVER_ARGS --tables=$TABLES --table-size=$TABLE_SIZE \
              cleanup 2>&1 | tee -a "$RESULT_FILE"

            echo "" | tee -a "$RESULT_FILE"
            echo "BENCHMARK COMPLETE. Results: $RESULT_FILE" | tee -a "$RESULT_FILE"
            SCRIPT
            chmod +x /opt/run-benchmark.sh
            chmod 644 /opt/bench-env.sh

            echo "=== Setup Complete: $(date) ==="
            echo "Run: /opt/run-benchmark.sh"
          - RDSEndpointAddr: !GetAtt RDSInstance.Endpoint.Address
            DBPort: !FindInMap [EngineConfig, !Ref DatabaseEngine, Port]
            DBEngine: !Ref DatabaseEngine
            DBInstanceClass: !Ref InstanceClass

Outputs:
  RDSEndpoint:
    Description: RDS instance endpoint
    Value: !GetAtt RDSInstance.Endpoint.Address

  RDSPort:
    Description: Database port
    Value: !FindInMap [EngineConfig, !Ref DatabaseEngine, Port]

  InstanceClassTested:
    Description: RDS instance class under test
    Value: !Ref InstanceClass

  DatabaseEngine:
    Description: Database engine
    Value: !Ref DatabaseEngine

  SessionManagerURL:
    Description: Connect to EC2 via Session Manager
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${BenchmarkEC2}?region=${AWS::Region}'

  BenchmarkCommand:
    Description: Run this on the EC2 to start the benchmark
    Value: /opt/run-benchmark.sh

  ResultsDirectory:
    Description: Results saved here on EC2
    Value: /opt/results/
